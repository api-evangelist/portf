name: PortF
description: PortF is an AI-powered portfolio monitoring platform for private equity, venture capital,
  and institutional investors. It automates investment data collection and reporting by extracting
  qualitative and quantitative data from emails, documents, and 25+ connected systems (Excel, OneDrive,
  SharePoint, SSO, Salesforce, FIS Global, Xero, QuickBooks, Sage, and NetSuite), then consolidates
  financial, ESG, and impact data into a single source of truth with real-time analytics, IRR
  benchmarking, and agentic reporting workflows. Founded by Alex Lu and headquartered in London,
  PortF is backed by Techstars.
